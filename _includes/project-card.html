<div class="project-card" style="background:#18181b;border-radius:24px;padding:0 0 24px 0;margin-bottom:32px;box-shadow:0 2px 16px rgba(0,0,0,0.2);max-width:400px;margin-left:auto;margin-right:auto;">
  {% if project.image %}
    <div style="position:relative;">
      <img src="/{{ project.image }}" alt="{{ project.title }}" style="width:100%;border-radius:24px 24px 0 0;object-fit:cover;max-height:220px;">
      <a href="{{ project.url }}" style="position:absolute;top:16px;right:16px;background:#fff;color:#18181b;padding:6px 18px;border-radius:16px;font-weight:600;text-decoration:none;">View</a>
    </div>
  {% endif %}
  <div style="padding:20px 24px 0 24px;">
    <h2 style="color:#fff;font-size:1.5rem;margin-bottom:8px;">{{ project.title }}</h2>
    <div style="margin-bottom:12px;">
      {% for tag in project.tags %}
        <span style="display:inline-block;background:#27272a;color:#fff;border-radius:12px;padding:4px 12px;font-size:0.85rem;margin:2px 4px 2px 0;">{{ tag }}</span>
      {% endfor %}
    </div>
    <div style="color:#d4d4d8;font-size:1rem;margin-bottom:16px;">{{ project.content | markdownify }}</div>
    {% if project.repo_url %}
      <a href="{{ project.repo_url }}" target="_blank" style="color:#a1a1aa;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a8 8 0 1 0 0 15.292a8 8 0 0 0 0-15.292z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.09 9.09a3 3 0 0 1 5.82 0M12 13v.01"/></svg>
        Source code
      </a>
    {% endif %}
  </div>
</div>
