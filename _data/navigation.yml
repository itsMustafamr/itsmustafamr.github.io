# The main navigation bar (rendered by _includes/masthead.html on every page).
#
# Each link jumps to a section of the single-page homepage. On the homepage the
# active link follows your scroll position; on any other page the link whose
# `match` prefix starts that page's URL is highlighted instead
# (e.g. a project page at /projects/narrait/ highlights "Projects").
#
# The full pages (/projects/, /publications/, /cv/, /teaching/, /contact/, ...)
# still exist and are linked from each homepage section.

main:
  - title: "About"
    url: /#about

  - title: "Updates"
    url: /#updates

  - title: "Projects"
    url: /#projects
    match: ["/projects/", "/portfolio/"]

  - title: "Publications"
    url: /#publications
    match: ["/publication"]

  - title: "Experience"
    url: /#experience
    match: ["/cv", "/teaching"]

  - title: "Skills"
    url: /#skills

  - title: "Contact"
    url: /#contact
    match: ["/contact"]

# The "CV" download button at the right end of the bar (also used on the homepage).
cv_url: "https://drive.google.com/file/d/1NSafYfmzddpe32ft9-ZsD5zoZeAHjO4B/view?usp=sharing"
