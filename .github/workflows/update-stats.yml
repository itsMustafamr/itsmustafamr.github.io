name: Update GitHub Stats

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Update GitHub stats
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        python3 scripts/github_stats.py itsmustafamr
        
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true      # Bundler installed & gems cached

    - name: Build site
      run: |
        bundle install           # uses cached gems if unchanged
        bundle exec jekyll build
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add assets/data/github_stats.json
        git commit -m "Auto-update GitHub stats" || exit 0
        git push 